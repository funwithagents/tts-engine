[project]
name = "tts-engine"
version = "0.1.0"
description = "Streaming text-to-speech engine, usable as a Python library or an MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
]

[project.scripts]
tts-engine-mcp = "tts_engine.mcp_server_cli:main"

# One extra per TTS provider and one per transport. The base install is the
# engine only — no default provider, no server stack — plus the tone/audiofile
# fixture modules (see specs/project.md, "Dependency strategy for TTS backends"
# and "Dependency strategy for transports"). A missing extra surfaces as a
# "pip install tts-engine[<name>]" hint.
[project.optional-dependencies]
# The official SDK plus miniaudio for the streaming MP3 -> PCM decode. <3: the
# 2.x text_to_speech.stream surface the module calls, validated on 2.74.1 — see
# specs/modules/elevenlabs.md.
elevenlabs = [
    "elevenlabs>=2.39,<3",
    "miniaudio",
]
# pocket-tts pulls in torch (~hundreds of MB) + a model download — see specs/modules/pocket.md.
pocket = [
    "pocket-tts>=4.0.1,<5",
]
# The official async SDK (aiohttp WebSocket); raw PCM output, so no codec — see specs/modules/gradium.md.
gradium = [
    "gradium>=0.6",
]
# The official SDK; streamed float32 PCM, so no codec. <4: 3.x moved the client to
# mistralai.client, which the module imports — see specs/modules/mistral.md.
mistral = [
    "mistralai>=3.5,<4",
]
# The official SDK (Fern-generated, sync websockets client); linear16 PCM, so no
# codec. <8: the 7.x major is the speak.v1 socket API the module drives — see
# specs/modules/deepgram.md.
deepgram = [
    "deepgram-sdk>=7.15,<8",
]
# The official SDK (Gemini Developer API); streamed little-endian 16-bit PCM, so no
# codec. <3: the 2.x generate_content_stream and response shapes the module
# reads — see specs/modules/gemini.md.
gemini = [
    "google-genai>=2.33,<3",
]
# The official SDK with its websockets extra (sync WebSocket client); raw
# pcm_s16le output, so no codec. <5: the 4.x websocket_connect / context API the
# module drives — see specs/modules/cartesia.md.
cartesia = [
    "cartesia[websockets]>=4.2,<5",
]
# The official openai SDK against /v1/audio/speech, OpenAI's own or any
# OpenAI-compatible server through base_url; streamed headerless pcm (s16le), so
# no codec. <4: the 3.x with_streaming_response API the module drives — see
# specs/modules/openai-compatible.md.
openai-compatible = [
    "openai>=3.37,<4",
]
# The same SDK on OpenAI's Realtime API (gpt-realtime-2.1-mini), the successor
# of its /v1/audio/speech models; the realtime extra adds websockets for the
# sync socket. Base64 s16le PCM deltas, so no codec. <4: the 3.x realtime.connect
# surface and GA event types the module reads — see specs/modules/openai.md.
openai = [
    "openai[realtime]>=3.37,<4",
]
# Gradium's Phonon on-device models through the ptts Rust runtime: numpy only,
# no torch. <0.6: pre-1.0 and fast-moving, validated on 0.5.0 — see specs/modules/phonon.md.
phonon = [
    "ptts>=0.4.2,<0.6",
]
# Qwen3-TTS through the qwentts.cpp GGML engine (numpy + huggingface-hub only).
# PyPI ships a Metal wheel for Apple silicon and CUDA 12.8 wheels for Linux, no
# CPU or Windows build: the extra is Apple-silicon only, and a Linux GPU host
# installs the wheel by hand. <0.6: alpha, pinned to one native ABI revision,
# validated on 0.5.0 — see specs/modules/qwen3.md.
qwen3 = [
    "qwentts-cpp-python>=0.5,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Kokoro-82M through kokoro-onnx (onnxruntime + a bundled espeak-ng, no torch),
# not the official torch `kokoro` package, which caps Python below 3.13.
# huggingface-hub fetches the model files, which kokoro-onnx does not download
# itself. <0.7: pre-1.0, validated on 0.6.1 — see specs/modules/kokoro.md.
kokoro = [
    "kokoro-onnx>=0.6.1,<0.7",
    "huggingface-hub",
]
# Piper through piper-tts (onnxruntime, espeak-ng compiled in, no torch). GPL-3.0+
# behind an optional extra. huggingface-hub fetches the voice files from
# rhasspy/piper-voices. <2: validated on 1.8.0 — see specs/modules/piper.md.
piper = [
    "piper-tts>=1.8,<2",
    "huggingface-hub",
]
# The MCP server (tts-engine-mcp). The plain SDK, not mcp[cli]: the cli extra
# only serves the SDK's own `mcp dev` tooling. uvicorn is imported directly.
# <2: mcp 2.x renamed FastMCP (mcp.server.fastmcp is gone).
mcp = [
    "mcp<2",
    "uvicorn",
]
all = [
    "tts-engine[elevenlabs,pocket,gradium,phonon,mistral,deepgram,gemini,cartesia,openai,openai-compatible,qwen3,kokoro,piper,mcp]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.8.0",
    "pyright>=1.1.411",
    # Every extra, via the `all` aggregate rather than a hand-maintained copy of
    # its members: a plain `uv sync --dev` then runs the whole suite — the unit
    # tests that mock a real provider library and every live row in tests-e2e/ —
    # with nothing skipped for a missing extra. Adding a provider extra to
    # `all` reaches the dev environment for free. The cost is torch in every
    # dev sync; consumers still install one provider at a time.
    "tts-engine[all]",
    # Named here (pocket-tts already brings it) only so the `torch` source below
    # applies: a uv source governs a dependency the project declares itself.
    "torch",
]

[[tool.uv.index]]
# PyPI's Linux torch wheel is the CUDA build and drags gigabytes of NVIDIA
# libraries no CI runner uses; on Linux torch resolves from PyTorch's CPU index
# instead. `explicit`: only packages pinned to it below come from here. macOS
# and Windows keep PyPI's wheels, CPU-only already. A uv source is not inherited
# downstream, so a consumer wanting the CPU build declares the index itself.
# See specs/ci.md and specs/project.md, "Key dependencies".
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # jsonpath-python (a mistralai dependency, 1.1.6 is the latest) probes the
    # AST node names deprecated in 3.12 with getattr() when its class is
    # defined, so importing the SDK warns. Upstream, harmless; scoped to that
    # module and message so any other DeprecationWarning still shows.
    "ignore:ast\\.\\w+ is deprecated:DeprecationWarning:jsonpath.jsonpath",
    # deepgram-sdk 7.x imports websockets' deprecated legacy client and
    # InvalidStatusCode as fallbacks when its package loads (the module drives
    # the modern sync client). Upstream, harmless; scoped to those messages.
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore:websockets\\.exceptions\\.InvalidStatusCode is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.ruff.lint.per-file-ignores]
"tests-e2e/__init__.py" = ["N999"]  # dir name intentionally hyphenated (opt-in tier)

[tool.pyright]
include = ["src", "tests", "tests-e2e", "benchmarks"]  # type-check test code and the benchmark too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

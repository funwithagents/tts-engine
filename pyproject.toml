[project]
name = "tts-engine"
version = "0.1.0"
description = "Streaming text-to-speech engine, usable as a Python library or an MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
]

[project.scripts]
tts-engine-mcp = "tts_engine.mcp_server_cli:main"

# One extra per TTS provider and one per transport. The base install is the
# engine only — no default provider, no server stack — plus the tone/audiofile
# fixture modules (see specs/project.md, "Dependency strategy for TTS backends"
# and "Dependency strategy for transports"). A missing extra surfaces as a
# "pip install tts-engine[<name>]" hint.
[project.optional-dependencies]
# The official SDK plus miniaudio for the streaming MP3 -> PCM decode.
elevenlabs = [
    "elevenlabs",
    "miniaudio",
]
# pocket-tts pulls in torch (~hundreds of MB) + a model download — see specs/modules/pocket.md.
pocket = [
    "pocket-tts>=4.0.1,<5",
]
# The official async SDK (aiohttp WebSocket); raw PCM output, so no codec — see specs/modules/gradium.md.
gradium = [
    "gradium>=0.6",
]
# The official SDK; streamed float32 PCM, so no codec. <4: 3.x moved the client to
# mistralai.client, which the module imports — see specs/modules/mistral.md.
mistral = [
    "mistralai>=3.5,<4",
]
# The MCP server (tts-engine-mcp). The plain SDK, not mcp[cli]: the cli extra
# only serves the SDK's own `mcp dev` tooling. uvicorn is imported directly.
# <2: mcp 2.x renamed FastMCP (mcp.server.fastmcp is gone).
# Gradium's Phonon on-device models through the ptts Rust runtime: numpy only,
# no torch. <0.5: pre-1.0 and fast-moving, validated on 0.4.2 — see specs/modules/phonon.md.
phonon = [
    "ptts>=0.4.2,<0.5",
]
mcp = [
    "mcp<2",
    "uvicorn",
]
all = [
    "tts-engine[elevenlabs,pocket,gradium,phonon,mistral,mcp]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.8.0",
    "pyright>=1.1.411",
    # Every extra, via the `all` aggregate rather than a hand-maintained copy of
    # its members: a plain `uv sync --dev` then runs the whole suite — the unit
    # tests that mock a real provider library and every live row in tests-e2e/ —
    # with nothing skipped for a missing extra. Adding a provider extra to
    # `all` reaches the dev environment for free. The cost is torch in every
    # dev sync; consumers still install one provider at a time.
    "tts-engine[all]",
    # Named here (pocket-tts already brings it) only so the `torch` source below
    # applies: a uv source governs a dependency the project declares itself.
    "torch",
]

[[tool.uv.index]]
# PyPI's Linux torch wheel is the CUDA build and drags gigabytes of NVIDIA
# libraries no CI runner uses; on Linux torch resolves from PyTorch's CPU index
# instead. `explicit`: only packages pinned to it below come from here. macOS
# and Windows keep PyPI's wheels, CPU-only already. A uv source is not inherited
# downstream, so a consumer wanting the CPU build declares the index itself.
# See specs/ci.md and specs/project.md, "Key dependencies".
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # jsonpath-python (a mistralai dependency, 1.1.6 is the latest) probes the
    # AST node names deprecated in 3.12 with getattr() when its class is
    # defined, so importing the SDK warns. Upstream, harmless; scoped to that
    # module and message so any other DeprecationWarning still shows.
    "ignore:ast\\.\\w+ is deprecated:DeprecationWarning:jsonpath.jsonpath",
]

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.ruff.lint.per-file-ignores]
"tests-e2e/__init__.py" = ["N999"]  # dir name intentionally hyphenated (opt-in tier)

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

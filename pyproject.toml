[project]
name = "tts-engine"
version = "0.1.0"
description = "Streaming text-to-speech engine, usable as a Python library or an MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
]

[project.scripts]
tts-engine-mcp = "tts_engine.mcp_server_cli:main"

# One extra per TTS provider and one per transport. The base install is the
# engine only — no default provider, no server stack — plus the tone/audiofile
# fixture modules (see specs/project.md, "Dependency strategy for TTS backends"
# and "Dependency strategy for transports"). A missing extra surfaces as a
# "pip install tts-engine[<name>]" hint.
[project.optional-dependencies]
# The official SDK plus miniaudio for the streaming MP3 -> PCM decode.
elevenlabs = [
    "elevenlabs",
    "miniaudio",
]
# pocket-tts pulls in torch (~hundreds of MB) + a model download — see specs/pocket-module.md.
pocket = [
    "pocket-tts>=3.1.0",
]
# The MCP server (tts-engine-mcp). The plain SDK, not mcp[cli]: the cli extra
# only serves the SDK's own `mcp dev` tooling. uvicorn is imported directly.
mcp = [
    "mcp",
    "uvicorn",
]
all = [
    "tts-engine[elevenlabs,pocket,mcp]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.8.0",
    "pyright>=1.1.411",
    # Light enough to keep in dev so the ElevenLabs unit tests run unchanged;
    # pocket (torch) stays out and its unit tests fake the library.
    "elevenlabs",
    "miniaudio",
    # The MCP stack, so tests/test_mcp*.py and tests-e2e/test_mcp.py run unchanged.
    "mcp",
    "uvicorn",
]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.ruff.lint.per-file-ignores]
"tests-e2e/__init__.py" = ["N999"]  # dir name intentionally hyphenated (opt-in tier)

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
